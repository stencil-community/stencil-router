name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Squash-merged PR titles become the commits that `release.yml` reads
      # to pick the next version automatically.
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(match): handle trailing slashes'. Got: $TITLE"
            exit 1
          fi

  check:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm --filter @stencil-community/router typecheck
      - run: pnpm --filter @stencil-community/router test

  demo:
    name: Demo (Stencil ${{ matrix.stencil }}, ${{ matrix.jsx }} JSX, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        stencil: ["4", "5-beta"]
        jsx: [automatic, classic]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Install the beta in every package: the router's type declarations
      # resolve @stencil/core from its own node_modules, so it must match the
      # demo's version (as it would in an app with a single install).
      - name: Install Stencil v5 beta
        if: matrix.stencil == '5-beta'
        run: |
          pnpm -r add -D @stencil/core@beta
          pnpm --filter @stencil-community/router typecheck
          pnpm --filter @stencil-community/router test

      - run: pnpm --filter @stencil-community/router build

      - name: Use classic jsxFactory
        if: matrix.jsx == 'classic'
        run: node packages/demo/scripts/use-classic-jsx.mjs

      - name: Migrate demo to Stencil v5
        if: matrix.stencil == '5-beta'
        working-directory: packages/demo
        run: pnpm exec stencil migrate

      - name: Build demo
        working-directory: packages/demo
        # v5 betas currently prerender light-DOM components without hydration
        # markers, so they render twice on load. Test a client-only build
        # until that's fixed upstream.
        run: pnpm exec stencil build ${{ matrix.stencil == '4' && '--prerender' || '' }}

      - run: pnpm --filter demo exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm --filter demo test
        env:
          NO_PRERENDER: ${{ matrix.stencil != '4' && '1' || '' }}
